<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>GPS Такси Шаран</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; background: #0d0d1a; color: white; }
        h2 { color: #f5c518; margin-bottom: 10px; }
        .warning { color: #f39c12; background: #1a1a2e; padding: 10px; border-radius: 8px; margin: 15px 0; }
        button { padding: 15px 30px; font-size: 18px; background: #2ecc71; color: white; border: none; border-radius: 12px; cursor: pointer; width: 90%; max-width: 350px; }
        button.stop { background: #e74c3c; }
        select { padding: 12px; width: 90%; max-width: 350px; margin-bottom: 15px; border-radius: 8px; }
        .status { margin-top: 20px; padding: 15px; border-radius: 8px; background: #1a1a2e; min-height: 60px; word-wrap: break-word; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <h2>🚖 Геолокация водителя</h2>
    <div class="warning">⚠️ При первом запуске нажмите «Разрешить всегда». Работает даже с выключенным экраном.</div>
   
    <select id="driverSelect">
        <option value="DRV_001">Машина 1 (Валера)</option>
        <option value="DRV_002">Машина 2 (Ринат)</option>
        <option value="DRV_003">Машина 3 (Айдар)</option>
    </select>

    <button id="btn">▶️ Начать передачу GPS</button>
    <div id="status" class="status wait">Ожидание запуска...</div>

    <script type="module" src="./main.js"></script>
</body>
</html>
