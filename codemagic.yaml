workflows:
  android-workflow:
    name: Taxi Sharan Tracker
    max_build_duration: 60
    environment:
      groups:
        - default
      vars:
        PACKAGE_NAME: "ru.taxisharan.driver"
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          gradle assembleRelease
    artifacts:
      - build/**/outputs/**/*.apk
      - build/**/outputs/**/*.aab
