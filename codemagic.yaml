workflows:
  android-workflow:
    name: Taxi Sharan Tracker
    max_build_duration: 60
    environment:
      groups:
        - default
      vars:
        PACKAGE_NAME: "ru.taxisharan.driver"
      java: 17
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          gradle assembleRelease --stacktrace
          # Показываем все созданные APK файлы
          find build -name "*.apk" -type f
      - name: Copy APK to artifacts
        script: |
          mkdir -p artifacts
          if [ -f "build/outputs/apk/release/app-release.apk" ]; then
            cp build/outputs/apk/release/app-release.apk artifacts/
          fi
          if [ -f "build/outputs/apk/debug/app-debug.apk" ]; then
            cp build/outputs/apk/debug/app-debug.apk artifacts/
          fi
    artifacts:
      - artifacts/*.apk
