workflows:
  android-workflow:
    name: Taxi Sharan Tracker
    max_build_duration: 60
    environment:
      groups:
        - default
      vars:
        PACKAGE_NAME: "ru.taxisharan.driver"
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
      - name: Build Android APK
        script: |
          gradle assembleRelease
    artifacts:
      - build/**/outputs/apk/**/*.apk
      - build/**/outputs/aab/**/*.aab
