workflows:
  android-workflow:
    name: Такси GPS Tracker (Android)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      android: latest
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/**/outputs/**/*.apk
