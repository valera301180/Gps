workflows:
  build-taxi-app:
    name: Сборка Такси Шаран
    instance_type: mac_mini_m1
    environment:
      node: latest
      java: corretto@17
    scripts:
      - name: Установка библиотек
        script: |
          npm install
          npx cap sync android
      - name: Сборка APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
