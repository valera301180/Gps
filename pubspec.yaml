name: taxi_gps_tracker
description: Легкое приложение для передачи геолокации водителя.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  geolocator: ^13.0.1        # Работа с GPS
  http: ^1.2.2                # Отправка данных на сервер
  shared_preferences: ^2.3.2  # Сохранение ID машины в памяти телефона

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
